name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the zip to, e.g. v1.0.4
        required: true
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test/run.mjs
      - name: Build yubishard.zip
        run: |
          dir="yubishard-$TAG"
          mkdir "$dir"
          cp index.html app.js styles.css serve.command serve.bat "$dir/"
          chmod +x "$dir/serve.command"
          zip -rX yubishard.zip "$dir"
          unzip -l yubishard.zip
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" yubishard.zip --clobber
